[project]
name = "alpha-os"
version = "0.1.0"
description = "Trading strategy contract package for alpha-os"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.28",
    "scipy>=1.12",
    "cvxpy>=1.6",
    "skfolio==0.16.1",
]

[project.urls]
Repository = "https://github.com/tomato414941/alpha-os"
Issues = "https://github.com/tomato414941/alpha-os/issues"

[project.optional-dependencies]
exchange = [
    "ccxt>=4.0",
]
research = [
    "deap>=1.4",
    "ribs[all]>=0.7",
]
optimizer = [
    "cvxpy>=1.6",
    "skfolio==0.16.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.4",
]
polymarket = [
    "py-clob-client>=0.17",
    "web3>=6.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "current: tests for maintained alpha_os package paths",
    "research: tests for historical or experimental paths",
]

[tool.ruff]
target-version = "py312"
line-length = 100
